name: mano-reck

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: manoreck
      POSTGRES_USER: manoreck
      POSTGRES_PASSWORD: manoreck_local
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${MANORECK_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manoreck -d manoreck"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks: [platform]

  nats:
    image: nats:2.15.0-alpine3.22@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --server_name=manoreck-local
    ports:
      - "127.0.0.1:${MANORECK_NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${MANORECK_NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider 'http://127.0.0.1:8222/healthz?js-enabled-only=true'",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    networks: [platform]

  redis:
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:${MANORECK_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s
    restart: unless-stopped
    networks: [platform]

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - -v=0
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:${MANORECK_SEAWEEDFS_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:9333/cluster/healthz >/dev/null && curl --silent http://127.0.0.1:8333/ >/dev/null",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

  kratos-migrate:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DSN: postgres://manoreck:manoreck_local@postgres:5432/kratos?sslmode=disable&max_conns=10&max_idle_conns=2
    command: -c /etc/config/kratos/kratos.yaml migrate sql -e --yes
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [platform]

  kratos:
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DSN: postgres://manoreck:manoreck_local@postgres:5432/kratos?sslmode=disable&max_conns=10&max_idle_conns=2
    command: serve -c /etc/config/kratos/kratos.yaml --dev
    ports:
      - "127.0.0.1:${MANORECK_KRATOS_PUBLIC_HOST_PORT:-4433}:4433"
      - "127.0.0.1:${MANORECK_KRATOS_ADMIN_HOST_PORT:-4434}:4434"
    volumes:
      - ./kratos:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4434/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [platform]

volumes:
  postgres-data:
  nats-data:
  redis-data:
  seaweedfs-data:

networks:
  platform:
    driver: bridge
